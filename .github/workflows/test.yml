name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Lint Code
        run: |
          cd server
          echo "Basic lint check (add eslint if needed)"