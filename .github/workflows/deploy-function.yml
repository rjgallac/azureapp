name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Compress Function App
        run: |
          cd server
          7za a -tzip -mx9 ../function.zip . -xr!*.git* -xr!node_modules/* -xr!local.settings.json -xr!.vscode/* -xr!src/*

      - name: Deploy Function App
        run: |
          az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          az webapp deployment source config-zip \
            --name ${{ secrets.FUNCTION_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} \
            --src ../function.zip

      - name: Verify Deployment
        run: |
          az functionapp list --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} --query "[].name" --output table