name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infrastructure/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure
        run: |
          echo "Current default subscription: $(az account show --query subscriptionId -o tsv)"
          echo "Current default tenant: $(az account show --query tenantId -o tsv)"
          az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: Enable Functions Settings
        run: |
          az functionapp config appsettings set \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --settings \
              FUNCTIONS_EXTENSION_VERSION=~4 \
              FUNCTIONS_WORKER_RUNTIME=node \
              NODE_VERSION=20 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy Functions Directly
        run: |
          echo "Copying Functions files to Azure..."

          # Create a fresh deployment archive with only required files
          mkdir -p ./deployment-source
          cd server

          # Copy function folders and host.json
          for dir in $(ls -d */); do
            if [[ "$dir" != "node_modules/" ]] && [[ "$dir" != .git* ]] && [[ "$dir" != .vscode* ]] && [[ "$dir" != src/ ]]; then
              cp -r "$dir" ../../deployment-source/
            fi
          done

          # Copy host.json and package.json if they exist
          if [ -f "host.json" ]; then
            cp host.json ../../deployment-source/
          fi

          if [ -f "package.json" ]; then
            cp package.json ../../deployment-source/
          fi

          echo "Function files deployment archive:"
          find ../../deployment-source -type f | sort

          # Use zip to create package
          cd ../../deployment-source
          zip -r ../function.zip .

          # Cleanup
          cd ../..
          rm -rf deployment-source

      - name: Deploy ZIP
        run: |
          echo "Starting Function App deployment..."
          az webapp deployment source config-zip \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --src ../function.zip

      - name: Restart
        run: |
          az webapp restart \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth

      - name: Verify
        run: |
          echo "Deployment verified!"
          az functionapp function list \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth || echo "Checking deployment status..."