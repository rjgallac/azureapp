name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infrastructure/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure
        run: |
          echo "Current default subscription: $(az account show --query subscriptionId -o tsv)"
          echo "Current default tenant: $(az account show --query tenantId -o tsv)"
          az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: Enable Functions
        run: |
          az functionapp config appsettings set \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --settings FUNCTIONS_EXTENSION_VERSION=~4 NODE_VERSION=20 SCM_DO_BUILD_DURING_DEPLOYMENT=true YARN_BUILD_COMMAND=build NPM_BUILD_COMMAND=build

      - name: Build Deployment ZIP
        run: |
          echo "Building deployment package..."

          # Install zip
          sudo apt-get update && sudo apt-get install -y zip

          # Create clean target directory
          mkdir -p ./deployment-source
          cp -r server/* ./deployment-source/

          # Remove unnecessary files
          rm -rf ./deployment-source/node_modules
          rm -rf ./deployment-source/.git
          rm -rf ./deployment-source/.vscode
          rm -f ./deployment-source/.funcignore
          rm -f ./deployment-source/src

          # Create zip with only required files
          cd ./deployment-source
          zip -r ../function.zip . -x "*.git*" "node_modules/*" ".vscode/*" "src/*"

          # Cleanup
          cd ..
          rm -rf ./deployment-source

      - name: Deploy Function App via ZIP
        run: |
          echo "Starting Function App deployment..."

          az webapp deployment source config-zip \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --src ../function.zip

      - name: Restart Function App
        run: |
          echo "Restarting Function App to apply changes..."
          az webapp restart \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --slot production

      - name: Verify Deployment
        run: |
          echo "Deployment complete! Check Azure Portal or test endpoint:"
          az functionapp function list \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth || echo "Functions may take a few minutes to register"

          # Test the function
          timeout 30 curl -X GET "https://rg-todos-func-app.azurewebsites.net/api/GetItems" -H "accept: application/json" || echo "Function endpoint check attempted"