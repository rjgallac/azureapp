name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Deploy via Azure CLI
        run: |
          az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

          # Enable Functions
          az functionapp config appsettings set \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --settings FUNCTIONS_EXTENSION_VERSION=~4 NODE_VERSION=20

          # Create and upload zip
          cd server
          7za a -tzip -mx9 function.zip . -xr!*.git* -xr!node_modules/* -xr!local.settings.json -xr!.vscode/* -xr!src/*

          # Deploy zip
          az webapp deployment source config-zip \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --src function.zip