name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Deploy via Azure CLI
        run: |
          cd server
          npm install -g azure-functions-core-tools@4
          func azure functionsapp publish ${{ secrets.FUNCTION_APP_NAME }}
        shell: bash