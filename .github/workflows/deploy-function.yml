name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infrastructure/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure
        run: |
          echo "Current default subscription: $(az account show --query subscriptionId -o tsv)"
          echo "Current default tenant: $(az account show --query tenantId -o tsv)"
          az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: Enable Functions
        run: |
          az functionapp config appsettings set \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --settings FUNCTIONS_EXTENSION_VERSION=~4 NODE_VERSION=20 SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy Backend
        run: |
          cd server

          # Initialize git and prepare files
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .

          # Try alternative deployment - check deployment source
          az webapp deployment source show-config \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth || \
            echo "Config not set"

          # List current files in Azure
          echo "Current Function App files:"
          az webapp deployment source show \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --query "repositoryUrl" || \
            echo "Could not retrieve repository URL"

      - name: Verify Deployment
        run: |
          echo "Deployment complete! Check Azure Portal for Function App status."
          az functionapp function list \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth || echo "Functions may take a few minutes to register"