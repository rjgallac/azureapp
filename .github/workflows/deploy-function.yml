name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infrastructure/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: '${{ secrets.AZURE_CLIENT_ID }}'
          client-secret: '${{ secrets.AZURE_CLIENT_SECRET }}'
          tenant-id: '${{ secrets.AZURE_TENANT_ID }}'
          subscription-id: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'

      - name: Enable Functions
        run: |
          az functionapp config appsettings set \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --settings FUNCTIONS_EXTENSION_VERSION=~4 NODE_VERSION=20 SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy Backend
        run: |
          cd server

          # Initialize git and sync files
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Update Function App"

          # Sync to Azure
          az webapp deployment source config --name rg-todos-func-app --resource-group rg-todos-uksouth --repo-url https://github.com/ --branch main --manual-integration

          # Restart to apply changes
          timeout 60 az webapp restart --name rg-todos-func-app --resource-group rg-todos-uksouth

      - name: Verify Deployment
        run: |
          echo "Deployment complete! Check Azure Portal for Function App status."
          az functionapp function list \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth || echo "Functions may take a few minutes to register"