name: Deploy Function App via Git Sync

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Enable Functions
        run: |
          az functionapp config appsettings set \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth \
            --settings FUNCTIONS_EXTENSION_VERSION=~4 NODE_VERSION=20 SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Initialize Git and Sync Files
        run: |
          cd server

          # Initialize git if not already
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Add all files (including package.json)
          git add .

          # Configure deployment target
          az webapp deployment source config \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth

          # Trigger sync
          git push --set-upstream origin main

      - name: Restart Function App
        run: |
          timeout 60 az webapp restart \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth

      - name: Verify Deployment
        run: |
          echo "Deployment complete. Check functions in Azure Portal or use:"
          az functionapp function list \
            --name rg-todos-func-app \
            --resource-group rg-todos-uksouth